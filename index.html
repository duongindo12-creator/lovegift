<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà Kỷ Niệm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Nút bật/tắt âm thanh hoặc tương tác */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            pointer-events: auto;
        }
        .icon-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Phong thư bất ngờ ở cuối */
        .letter-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 90%;
            max-width: 400px;
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 20;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
            border: 2px solid #ffb6c1;
        }
        .letter-modal.active {
            transform: translate(-50%, -50%) scale(1);
        }
        .letter-modal h2 {
            color: #d1477a;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .letter-modal p {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-letter {
            background: #ff4d79;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .close-letter:hover {
            background: #e03b65;
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        <div class="top-bar">
            <button class="icon-btn" id="soundBtn" title="Bật/Tắt nhạc">🎵</button>
            <button class="icon-btn" id="letterBtn" title="Mở thư">💌</button>
        </div>
    </div>

    <!-- Hộp thư bất ngờ -->
    <div class="letter-modal" id="letterModal">
        <h2>Gửi đến cậu! 💖</h2>
        <p>Cảm ơn vì đã luôn ở bên tớ. Chúc cậu một ngày ngập tràn niềm vui, luôn xinh đẹp và hạnh phúc nhé!</p>
        <button class="close-letter" id="closeBtn">Đóng lại</button>
    </div>

    <!-- Nhạc nền (có thể thay đổi đường dẫn file nhạc của bạn vào đây) -->
    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mp3">
    </audio>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Tải 5 hình ảnh kỷ niệm
        const images = [];
        const imageSrcs = ['img1.jpg', 'img2.jpg', 'img3.jpg', 'img4.jpg', 'img5.jpg']; // Thay link ảnh hoặc tên file của bạn vào đây
        
        imageSrcs.forEach((src, index) => {
            const img = new Image();
            img.src = src;
            images.push(img);
        });

        // Tạo hiệu ứng hạt trái tim và ảnh bay
        const particles = [];
        const particleCount = 1000;

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5;
                this.color = '#ff4d79';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Vị trí hiển thị 5 ảnh theo quỹ đạo trái tim hoặc vòng tròn
        let angle = 0;
        function drawImages() {
            angle += 0.01;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.25;

            images.forEach((img, index) => {
                const theta = angle + (index * (Math.PI * 2 / images.length));
                const x = centerX + radius * Math.cos(theta) - 30;
                const y = centerY + radius * Math.sin(theta) - 30;

                ctx.save();
                ctx.beginPath();
                ctx.arc(x + 30, y + 30, 35, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                if (img.complete && img.naturalHeight !== 0) {
                    ctx.drawImage(img, x, y, 60, 60);
                } else {
                    ctx.fillStyle = '#ffb6c1';
                    ctx.fillRect(x, y, 60, 60);
                }
                ctx.restore();

                // Viền khung ảnh lung linh
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x + 30, y + 30, 35, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawImages();
            requestAnimationFrame(animate);
        }
        animate();

        // Xử lý sự kiện bấm nút mở thư và phát nhạc
        const soundBtn = document.getElementById('soundBtn');
        const bgMusic = document.getElementById('bgMusic');
        const letterBtn = document.getElementById('letterBtn');
        const letterModal = document.getElementById('letterModal');
        const closeBtn = document.getElementById('closeBtn');

        let isPlaying = false;
        soundBtn.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                soundBtn.textContent = '🎵';
            } else {
                bgMusic.play();
                soundBtn.textContent = '🔇';
            }
            isPlaying = !isPlaying;
        });

        letterBtn.addEventListener('click', () => {
            letterModal.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            letterModal.classList.remove('active');
        });
    </script>
</body>
</html>
const imageSrcs = ['', '', '', '', ''];
